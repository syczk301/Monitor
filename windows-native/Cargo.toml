[workspace]
resolver = "2"
members = [
  "crates/monitor-app",
  "crates/monitor-media",
  "crates/monitor-plugin-api",
  "crates/monitor-storage",
  "crates/monitor-web",
]

[workspace.package]
version = "4.7.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
atomicwrites = "0.4"
async-stream = "0.3"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
fs2 = "0.4"
http = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = "0.23"
rustls-pemfile = "2"
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Capture",
  "Media_Capture_Frames",
  "Media_MediaProperties",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
