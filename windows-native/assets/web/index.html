<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>智能客流分析系统</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Microsoft YaHei UI', 'Segoe UI', -apple-system, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Desktop styles ===== */
    .header {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .nav-btn {
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s;
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.39);
    }

    .nav-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .wrap {
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }

    .card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.1); }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: '';
      display: block;
      width: 4px;
      height: 20px;
      background: var(--primary);
      border-radius: 2px;
    }

    img {
      width: 100%;
      border-radius: 12px;
      display: block;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .kpi {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .kpi div {
      background: rgba(15, 23, 42, 0.5);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.2s;
    }

    .kpi div:hover { background: rgba(30, 41, 59, 0.8); border-color: rgba(255, 255, 255, 0.1); }

    .kpi div strong {
      display: block;
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .kpi div p {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      box-shadow: 0 0 8px var(--accent);
    }

    .value-highlight { color: var(--primary) !important; }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tool-btn:hover { background: rgba(255, 255, 255, 0.12); }

    .tool-btn.active {
      background: rgba(59, 130, 246, 0.2);
      color: #bfdbfe;
      border-color: rgba(59, 130, 246, 0.55);
    }

    .monitor-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .monitor-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .monitor-toolbar-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .monitor-toolbar-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .roi-tag {
      position: absolute;
      left: 0;
      top: -24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.88);
      color: #d1fae5;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.45);
      white-space: nowrap;
    }

    /* ===== App shell mode (IntelligentFlowShell) ===== */
    body.app-shell {
      background: #0a0e1a;
      background-image: none;
    }

    body.app-shell .header { display: none; }

    body.app-shell .wrap {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin: 0;
      padding: 0;
      max-width: 100%;
    }

    body.app-shell .card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    body.app-shell .card:hover { transform: none; }

    /* -- video section -- */
    body.app-shell .stream-section {
      position: relative;
    }

    body.app-shell .stream-section img {
      border-radius: 0;
      box-shadow: none;
      border: none;
    }

    body.app-shell .monitor-head { display: none; }

    body.app-shell #stream-container {
      border-radius: 0 !important;
      border: none !important;
    }

    /* -- floating toolbar -- */
    body.app-shell .app-float-bar {
      display: flex;
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      gap: 8px;
    }

    body.app-shell .app-float-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    body.app-shell .app-float-btn:active {
      transform: scale(0.95);
      background: rgba(30, 41, 59, 0.9);
    }

    body.app-shell .app-float-btn.active {
      background: rgba(59, 130, 246, 0.35);
      border-color: rgba(59, 130, 246, 0.6);
      color: #bfdbfe;
    }

    /* -- KPI dashboard -- */
    body.app-shell .kpi-section {
      padding: 16px;
    }

    body.app-shell .kpi-section-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin: 0 0 12px 4px;
    }

    body.app-shell .kpi {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    body.app-shell .kpi div {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      transition: none;
    }

    body.app-shell .kpi div:hover { transform: none; background: rgba(30, 41, 59, 0.5); }

    body.app-shell .kpi div strong {
      font-size: 0.62rem;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    body.app-shell .kpi div p {
      font-size: 1.4rem;
      font-weight: 700;
    }

    body.app-shell .kpi div p#capture-status,
    body.app-shell .kpi div p#capture-backend {
      font-size: 0.85rem;
    }

    body.app-shell #stream-error {
      padding: 0 16px;
      font-size: 0.82rem;
    }

    .app-float-bar { display: none; }
    /* ===== 2026 light operations redesign ===== */
    :root { --bg:#f6f7f9; --card-bg:#fff; --text:#15171c; --text-muted:#69707d; --primary:#4f46e5; --primary-hover:#4338ca; --accent:#1d9a5b; }
    body { background:#f6f7f9; background-image:none; color:var(--text); }
    .shell { min-height:100vh; display:grid; grid-template-columns:128px minmax(0,1fr); }
    .side-nav { position:sticky; top:0; height:100vh; background:#fff; color:#252932; display:flex; flex-direction:column; align-items:stretch; border-right:1px solid #e1e3e8; }
    .brand { height:94px; display:flex; align-items:center; justify-content:center; border-bottom:1px solid #e7e9ed; background:#fbfbfc; }
    .brand img { width:54px; height:54px; box-shadow:0 0 0 1px rgba(79,70,229,.08); border:0; border-radius:50%; }
    .side-link { color:#626975; background:transparent; text-decoration:none; display:flex; gap:10px; align-items:center; padding:18px 16px; font-size:14px; border-left:3px solid transparent; }
    .side-link i { font-size:20px; width:24px; text-align:center; }
    .bi { display:none; }
    .side-link:hover { color:#34303f; background:#f6f6fa; }
    .side-link.active { color:#4338ca; background:#efefff; border-left-color:#5b51e8; font-weight:650; }
    .side-bottom { margin-top:auto; border-top:1px solid #e7e9ed; }
    .workspace { min-width:0; }
    .topbar { height:94px; display:flex; align-items:center; gap:28px; padding:0 30px; background:#fff; border-bottom:1px solid #e1e3e8; }
    .topbar h1 { font-size:24px; margin:0; font-weight:700; }
    .site-select { border:1px solid #d9dce3; border-radius:8px; padding:11px 14px; background:#fff; color:#333842; min-width:230px; min-height:44px; cursor:pointer; }
    .site-select:focus-visible { outline:3px solid rgba(79,70,229,.24); outline-offset:2px; border-color:#4f46e5; }
    .site-select:disabled { cursor:wait; color:#7a818c; background:#f4f5f7; }
    .health { display:flex; align-items:center; gap:8px; color:#178c50; font-weight:650; }
    .health::before { content:''; width:9px; height:9px; border-radius:50%; background:#21a862; box-shadow:0 0 0 4px #e3f5eb; }
    .alert-link { margin-left:auto; text-decoration:none; color:#fff; background:#4f46e5; padding:12px 18px; border-radius:8px; font-weight:650; }
    .dashboard { padding:28px 30px 34px; display:grid; grid-template-columns:minmax(0,1.9fr) minmax(320px,.95fr); gap:34px; max-width:1600px; }
    .section-title { margin:0 0 14px; font-size:20px; }
    .video-frame { background:#111; border:1px solid #d9dce2; border-radius:10px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    #stream-container { border-radius:0!important; border:0!important; min-height:0; aspect-ratio:16/9; background:#111; }
    #stream { box-shadow:none; opacity:0; transition:opacity .22s ease; }
    #stream-container.stream-ready #stream { opacity:1; }
    .stream-loading { position:absolute; inset:0; z-index:12; display:grid; place-items:center; background:#f4f5f7; color:#555d68; text-align:center; }
    .stream-loading[hidden] { display:none; }
    .stream-loading-content { display:grid; gap:10px; justify-items:center; }
    .stream-loading-ring { width:28px; height:28px; border:3px solid #d9dce3; border-top-color:#4f46e5; border-radius:50%; animation:stream-spin .8s linear infinite; }
    .stream-loading strong { color:#292d35; font-size:15px; }
    .stream-loading small { color:#7a818c; font-size:12px; }
    @keyframes stream-spin { to { transform:rotate(360deg); } }
    .camera-toolbar { height:72px; display:flex; align-items:center; gap:8px; padding:0 16px; background:#fff; border-top:1px solid #e2e4e8; }
    .tool-btn { display:inline-flex; align-items:center; gap:8px; color:#272b33; background:transparent; border:0; border-radius:7px; padding:10px 12px; box-shadow:none; }
    .tool-btn:hover { background:#f0f1f4; }
    .tool-btn.active { color:#4038d5; background:#eeedff; border:0; }
    .tool-btn i { font-size:19px; }
    .toolbar-spacer { flex:1; }
    .quality-select { border:1px solid #d9dce3; background:#fff; border-radius:7px; padding:9px 12px; }
    .metric-strip { margin-top:18px; display:grid; grid-template-columns:repeat(6,1fr); background:#fff; border:1px solid #e0e2e7; border-radius:9px; }
    .metric { min-width:0; padding:16px 18px; border-right:1px solid #e8e9ed; }
    .metric:last-child { border:0; }
    .metric span { display:block; color:#777e89; font-size:12px; margin-bottom:5px; }
    .metric strong { font-size:17px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .metric strong.primary { color:#4f46e5; font-size:22px; }
    .activity-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .activity-date { color:#666d78; font-size:13px; }
    .activity-list { border-top:1px solid #dfe2e7; }
    .activity-row { display:grid; grid-template-columns:78px 34px 1fr; gap:10px; align-items:center; padding:17px 4px; border-bottom:1px solid #e3e5e9; }
    .activity-time { color:#737985; font-size:13px; }
    .activity-icon { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; color:#178c50; background:#e9f7f0; }
    .activity-icon.warn { color:#a66500; background:#fff3dc; }
    .activity-copy strong { display:block; font-size:15px; }
    .activity-copy small { color:#7a818c; }
    .activity-empty { padding:34px 4px; color:#858c96; text-align:center; border-top:1px solid #dfe2e7; font-size:13px; }
    .settings-panel { margin-top:22px; padding:18px; background:#fff; border:1px solid #e0e2e7; border-radius:9px; }
    .settings-grid { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; }
    .settings-grid label { display:grid; gap:6px; font-size:12px; color:#69707d; }
    .settings-grid select { border:1px solid #d7dae1; border-radius:7px; padding:10px; background:#fff; color:#252932; }
    #cam-apply { border:0; border-radius:7px; background:#4f46e5; color:#fff; padding:11px 18px; font-weight:650; }
    .status-copy { color:#7a818c; font-size:12px; margin:8px 0 0; }
    .app-float-bar { display:none; }
    @media(max-width:1050px){.shell{grid-template-columns:76px 1fr}.side-link span{display:none}.side-link{justify-content:center}.dashboard{grid-template-columns:1fr}.metric-strip{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:680px){.shell{display:block}.side-nav{height:auto;position:relative;flex-direction:row}.brand{width:70px;height:64px}.brand img{width:42px;height:42px}.side-link{padding:18px 12px}.side-bottom{margin-left:auto;border:0}.topbar{height:auto;padding:16px;flex-wrap:wrap;gap:12px}.topbar h1{font-size:19px}.site-select{min-width:0}.dashboard{padding:18px 14px;gap:24px}.metric-strip{grid-template-columns:repeat(2,1fr)}.camera-toolbar{overflow-x:auto}.activity-row{grid-template-columns:65px 30px 1fr}}
  </style>
</head>

  <button id="app-sound-toggle" hidden></button><button id="app-record-toggle" hidden></button><button id="app-roi-toggle" hidden></button>
  <script>
    const isAppShell = navigator.userAgent.includes("IntelligentFlowShell");
    if (isAppShell) {
      document.body.classList.add("app-shell");
    }

    const roiToggle = document.getElementById("roi-toggle");
    const appRoiToggle = document.getElementById("app-roi-toggle");
    const soundToggle = document.getElementById("sound-toggle");
    const appSoundToggle = document.getElementById("app-sound-toggle");
    const recordToggle = document.getElementById("record-toggle");
    const cameraSelect = document.getElementById("camera-select");
    const appRecordToggle = document.getElementById("app-record-toggle");
    const audioStatus = document.getElementById("audio-status");
    const recordStatus = document.getElementById("record-status");
    const schedulePanel = document.getElementById("schedule-settings");
    const scheduleStart = document.getElementById("schedule-start");
    const scheduleEnd = document.getElementById("schedule-end");
    const scheduleApply = document.getElementById("schedule-apply");
    const scheduleMsg = document.getElementById("schedule-msg");
    const scheduleDayInputs = Array.from(document.querySelectorAll("#schedule-days input"));
    const recordModeMetric = document.getElementById("record-mode-metric");

    const streamImage = document.getElementById("stream");
    const streamError = document.getElementById("stream-error");
    const streamLoading = document.getElementById("stream-loading");
    const streamLoadingTitle = document.getElementById("stream-loading-title");
    const streamLoadingDetail = document.getElementById("stream-loading-detail");
    streamImage.addEventListener("error", () => {
      streamError.innerText = "信号流丢失或加载失败，请确保后台识别服务运行正常且摄像头可用。";
    });

    let click1 = null;
    const streamLayer = document.getElementById("roi-layer");
    const streamContainer = document.getElementById("stream-container");
    const streamWrapper = document.getElementById("stream-wrapper");
    let roiDrawEnabled = false;

    let scale = 1;
    let fitScale = 1;
    let imageWidth = 1280;
    let imageHeight = 720;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startPanX = 0;
    let startPanY = 0;
    let audioEnabled = false;
    let audioConnecting = false;
    let audioContext = null;
    let audioAbortController = null;
    let pendingAudioBytes = new Uint8Array(0);
    let nextAudioStartTime = 0;

    function setAudioStatus(message, color = "var(--text-muted)") {
      audioStatus.textContent = message;
      audioStatus.style.color = color;
    }

    function updateSoundButtons() {
      const label = audioConnecting ? "正在开启…" : (audioEnabled ? "关闭声音" : "开启声音");
      if (soundToggle) {
        soundToggle.textContent = label;
        soundToggle.classList.toggle("active", audioEnabled);
        soundToggle.disabled = audioConnecting;
      }
      if (appSoundToggle) {
        appSoundToggle.textContent = label;
        appSoundToggle.classList.toggle("active", audioEnabled);
        appSoundToggle.disabled = audioConnecting;
      }
    }

    function updateRecordButtons(mode, busy = false) {
      if (recordToggle) {
        recordToggle.value = mode || "off";
        recordToggle.disabled = busy;
      }
      if (appRecordToggle) {
        appRecordToggle.textContent = mode === "continuous" ? "持续录像" : mode === "auto" ? "自动录像" : mode === "schedule" ? "定时录像" : "录像关闭";
        appRecordToggle.classList.toggle("active", mode !== "off");
        appRecordToggle.disabled = busy;
      }
      if (schedulePanel) schedulePanel.hidden = mode !== "schedule";
    }

    function appendUint8Arrays(left, right) {
      const merged = new Uint8Array(left.length + right.length);
      merged.set(left, 0);
      merged.set(right, left.length);
      return merged;
    }

    function pcm16ToFloat32(pcm16, sourceRate, targetRate) {
      if (!pcm16.length) return new Float32Array(0);
      if (sourceRate === targetRate) {
        const out = new Float32Array(pcm16.length);
        for (let i = 0; i < pcm16.length; i++) out[i] = Math.max(-1, Math.min(1, pcm16[i] / 32768));
        return out;
      }
      const targetLength = Math.max(1, Math.round(pcm16.length * targetRate / sourceRate));
      const out = new Float32Array(targetLength);
      for (let i = 0; i < targetLength; i++) {
        const srcPos = i * (sourceRate / targetRate);
        const leftIndex = Math.floor(srcPos);
        const rightIndex = Math.min(pcm16.length - 1, leftIndex + 1);
        const t = srcPos - leftIndex;
        const sample = pcm16[leftIndex] + (pcm16[rightIndex] - pcm16[leftIndex]) * t;
        out[i] = Math.max(-1, Math.min(1, sample / 32768));
      }
      return out;
    }

    function queueAudioChunk(pcm16, sampleRate) {
      if (!audioContext || !pcm16.length) return;
      const floatSamples = pcm16ToFloat32(pcm16, sampleRate, audioContext.sampleRate);
      if (!floatSamples.length) return;
      const buffer = audioContext.createBuffer(1, floatSamples.length, audioContext.sampleRate);
      buffer.copyToChannel(floatSamples, 0);
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      source.connect(audioContext.destination);
      const startAt = Math.max(nextAudioStartTime, audioContext.currentTime + 0.03);
      source.start(startAt);
      nextAudioStartTime = startAt + buffer.duration;
      if (nextAudioStartTime - audioContext.currentTime > 1.0) {
        nextAudioStartTime = audioContext.currentTime + 0.2;
      }
    }

    async function stopAudioStream(updateText = true) {
      audioEnabled = false;
      audioConnecting = false;
      updateSoundButtons();
      pendingAudioBytes = new Uint8Array(0);
      nextAudioStartTime = 0;
      if (audioAbortController) {
        audioAbortController.abort();
        audioAbortController = null;
      }
      if (audioContext) {
        try { await audioContext.close(); } catch (e) { }
        audioContext = null;
      }
      if (updateText) setAudioStatus("声音已关闭。", "var(--text-muted)");
    }

    async function startAudioStream() {
      if (audioEnabled) return;
      try {
        audioConnecting = true;
        updateSoundButtons();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) throw new Error("当前浏览器不支持音频播放");
        audioContext = new AudioCtx();
        if (audioContext.state === "suspended") await audioContext.resume();
        audioAbortController = new AbortController();
        pendingAudioBytes = new Uint8Array(0);
        nextAudioStartTime = audioContext.currentTime + 0.1;

        const response = await fetch(activeAudioUrl, {
          signal: audioAbortController.signal,
          cache: "no-store",
        });
        if (!response.ok || !response.body) {
          throw new Error(`麦克风流不可用 (${response.status})`);
        }
        const sampleRate = parseInt(response.headers.get("X-Audio-Sample-Rate") || "16000", 10);
        audioEnabled = true;
        audioConnecting = false;
        updateSoundButtons();
        setAudioStatus("声音已开启，正在播放当前摄像头的声音。", "var(--accent)");

        const reader = response.body.getReader();
        while (audioEnabled) {
          const { done, value } = await reader.read();
          if (done) break;
          if (!value || !value.length) continue;

          let merged = appendUint8Arrays(pendingAudioBytes, value);
          if (merged.length % 2 !== 0) {
            pendingAudioBytes = merged.slice(merged.length - 1);
            merged = merged.slice(0, merged.length - 1);
          } else {
            pendingAudioBytes = new Uint8Array(0);
          }
          if (!merged.length) continue;

          const pcm16 = new Int16Array(merged.buffer, merged.byteOffset, merged.byteLength / 2);
          queueAudioChunk(pcm16, sampleRate);
        }

        if (audioEnabled) {
          throw new Error("音频连接已中断");
        }
      } catch (error) {
        const aborted = error && error.name === "AbortError";
        await stopAudioStream(!aborted);
        if (!aborted) {
          setAudioStatus(`声音开启失败：${error.message || "未知错误"}`, "#ef4444");
        }
      }
    }

    async function toggleAudioStream() {
      if (audioEnabled) {
        await stopAudioStream(true);
      } else {
        await startAudioStream();
      }
    }

    function getDisplayScale() {
      return fitScale * scale;
    }

    function syncStreamViewport() {
      const nw = streamImage.naturalWidth || imageWidth || 1280;
      const nh = streamImage.naturalHeight || imageHeight || 720;
      imageWidth = nw;
      imageHeight = nh;
      const containerWidth = streamContainer.clientWidth || nw;
      fitScale = containerWidth / nw;
      streamContainer.style.height = `${Math.round(nh * fitScale)}px`;
      streamWrapper.style.width = `${nw}px`;
      streamWrapper.style.height = `${nh}px`;
      updateTransform();
    }

    function clampPan() {
      if (scale <= 1) { panX = 0; panY = 0; return; }
      const containerRect = streamContainer.getBoundingClientRect();
      const displayScale = getDisplayScale();
      const scaledWidth = imageWidth * displayScale;
      const scaledHeight = imageHeight * displayScale;
      panX = Math.min(0, Math.max(containerRect.width - scaledWidth, panX));
      panY = Math.min(0, Math.max(containerRect.height - scaledHeight, panY));
    }

    function updateInteractionCursor() {
      if (roiDrawEnabled) { streamLayer.style.cursor = "crosshair"; return; }
      if (scale <= 1) { streamLayer.style.cursor = "default"; return; }
      streamLayer.style.cursor = isPanning ? "grabbing" : "grab";
    }

    function updateTransform() {
      clampPan();
      const displayScale = getDisplayScale();
      streamWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${displayScale})`;
    }

    function clearTempRoi() {
      click1 = null;
      const temp = document.getElementById("temp-roi");
      if (temp) temp.remove();
    }

    function setRoiDrawEnabled(enabled) {
      roiDrawEnabled = enabled;
      roiToggle.classList.toggle("active", enabled);
      roiToggle.innerText = enabled ? "退出圈选" : "高级圈选";
      if (appRoiToggle) {
        appRoiToggle.classList.toggle("active", enabled);
        appRoiToggle.innerText = enabled ? "退出圈选" : "区域圈选";
      }
      if (!enabled) clearTempRoi();
      updateInteractionCursor();
    }

    roiToggle.addEventListener("click", () => setRoiDrawEnabled(!roiDrawEnabled));
    if (soundToggle) soundToggle.addEventListener("click", toggleAudioStream);
    if (appSoundToggle) appSoundToggle.addEventListener("click", toggleAudioStream);

    streamContainer.addEventListener("wheel", (e) => {
      e.preventDefault();
      const wheel = e.deltaY < 0 ? 1 : -1;
      let zoom = Math.exp(wheel * 0.1);
      const rect = streamContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      let newScale = Math.max(1, Math.min(scale * zoom, 10));
      const oldDisplayScale = getDisplayScale();
      const newDisplayScale = fitScale * newScale;
      const imageX = (mouseX - panX) / oldDisplayScale;
      const imageY = (mouseY - panY) / oldDisplayScale;
      panX = mouseX - imageX * newDisplayScale;
      panY = mouseY - imageY * newDisplayScale;
      scale = newScale;
      updateTransform();
    }, { passive: false });

    streamContainer.addEventListener("mousedown", (e) => {
      const canPan = scale > 1;
      const isLeftDrag = canPan && e.button === 0 && !roiDrawEnabled && e.target.tagName.toLowerCase() !== "button";
      const isRightDrag = canPan && e.button === 2;
      if (isLeftDrag || isRightDrag) {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        updateInteractionCursor();
        e.preventDefault();
      }
    });

    window.addEventListener("mousemove", (e) => {
      if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; updateTransform(); }
    });
    window.addEventListener("mouseup", () => { if (isPanning) { isPanning = false; updateInteractionCursor(); } });
    window.addEventListener("resize", syncStreamViewport);
    streamContainer.addEventListener("mouseleave", () => { if (isPanning) { isPanning = false; updateInteractionCursor(); } });
    streamContainer.addEventListener("contextmenu", (e) => e.preventDefault());

    streamLayer.addEventListener("mousedown", (e) => {
      if (e.target.tagName.toLowerCase() === 'button' || e.button !== 0) return;
      if (!roiDrawEnabled) return;
      const rect = streamContainer.getBoundingClientRect();
      const displayScale = getDisplayScale();
      const x = Math.max(0, Math.min(imageWidth, (e.clientX - rect.left - panX) / displayScale));
      const y = Math.max(0, Math.min(imageHeight, (e.clientY - rect.top - panY) / displayScale));
      const realX = Math.round(x);
      const realY = Math.round(y);

      if (!click1) {
        click1 = { realX, realY, domX: x, domY: y };
        const temp = document.createElement("div");
        temp.id = "temp-roi";
        Object.assign(temp.style, { position: "absolute", border: "2px dashed #3b82f6", left: x+"px", top: y+"px", width: "0px", height: "0px", pointerEvents: "none" });
        streamLayer.appendChild(temp);
      } else {
        const firstClick = click1;
        clearTempRoi();
        const x1 = Math.min(firstClick.realX, realX), y1 = Math.min(firstClick.realY, realY);
        const x2 = Math.max(firstClick.realX, realX), y2 = Math.max(firstClick.realY, realY);
        if (x2 - x1 < 20 || y2 - y1 < 20) return;
        if (confirm("是否将此框选区域设为【固定人员检测区】？")) {
          fetch("/api/rois", { method: "POST", body: JSON.stringify({ bbox: [x1, y1, x2, y2] }), headers: { "Content-Type": "application/json" } }).then(loadRois);
        }
      }
    });

    streamLayer.addEventListener("mousemove", (e) => {
      if (!roiDrawEnabled || !click1) return;
      const rect = streamContainer.getBoundingClientRect();
      const displayScale = getDisplayScale();
      const x = Math.max(0, Math.min(imageWidth, (e.clientX - rect.left - panX) / displayScale));
      const y = Math.max(0, Math.min(imageHeight, (e.clientY - rect.top - panY) / displayScale));
      const temp = document.getElementById("temp-roi");
      if (temp) {
        temp.style.left = Math.min(click1.domX, x) + "px";
        temp.style.top = Math.min(click1.domY, y) + "px";
        temp.style.width = Math.abs(x - click1.domX) + "px";
        temp.style.height = Math.abs(y - click1.domY) + "px";
      }
    });

    async function loadRois() {
      try {
        const res = await fetch("/api/rois");
        const rois = await res.json();
        const nw = streamImage.naturalWidth || imageWidth || 1280;
        const nh = streamImage.naturalHeight || imageHeight || 720;
        imageWidth = nw;
        imageHeight = nh;
        syncStreamViewport();

        Array.from(streamLayer.children).forEach(c => { if (c.id !== "temp-roi") c.remove(); });
        rois.forEach((roi, index) => {
          const [x1, y1, x2, y2] = roi.bbox;
          const box = document.createElement("div");
          box.className = "roi-box";
          Object.assign(box.style, {
            position: "absolute", border: "2px dashed #10b981", backgroundColor: "rgba(16, 185, 129, 0.1)",
            left: `${x1}px`, top: `${y1}px`, width: `${x2-x1}px`, height: `${y2-y1}px`
          });

          const tag = document.createElement("div");
          tag.className = "roi-tag";
          tag.innerText = `ROI ${index + 1}`;
          box.appendChild(tag);

          const delBtn = document.createElement("button");
          delBtn.innerText = "\u00d7";
          Object.assign(delBtn.style, { position: "absolute", top: "0", right: "0", background: "#ef4444", color: "white", border: "none", borderRadius: "0 0 0 4px", cursor: "pointer", padding: "2px 6px", fontSize: "0.75rem" });
          delBtn.onclick = (e) => { e.stopPropagation(); fetch(`/api/rois/${roi.id}`, { method: "DELETE" }).then(loadRois); };
          box.appendChild(delBtn);
          streamLayer.appendChild(box);

        });
      } catch (e) { }
    }

    streamImage.onload = () => {
      syncStreamViewport();
      loadRois();
    };
    if (streamImage.complete) {
      syncStreamViewport();
      loadRois();
    }
    setInterval(loadRois, 5000);

    async function pullStats() {
      try {
        const res = await fetch("/api/selected_stats");
        if (!res.ok) return;
        const d = await res.json();
        document.getElementById("fps").innerText = d.fps.toFixed(1);
        document.getElementById("latency").innerText = Number.isFinite(d.preview_frame_ms) && d.preview_frame_ms > 0 ? d.preview_frame_ms.toFixed(0) + "ms" : "--";
        document.getElementById("targets").innerText = d.tracked_targets;
        document.getElementById("gpu").innerText = d.gpu_utilization.toFixed(0) + "%";
        const cs = document.getElementById("capture-status");
        cs.innerText = d.capture_status || "-";
        cs.style.color = d.capture_status === "running" ? "var(--accent)" : "#ef4444";
        document.getElementById("capture-backend").innerText = d.capture_backend || "-";
        const ready = d.capture_status === "running";
        streamContainer.classList.toggle("stream-ready", ready);
        streamLoading.hidden = ready;
        if (!ready) {
          streamLoadingTitle.textContent = "正在连接摄像头";
          streamLoadingDetail.textContent = d.capture_status && d.capture_status !== "waiting" ? `当前状态：${d.capture_status}` : "画面准备好后会自动显示";
        }
      } catch (e) { }
    }
    setInterval(pullStats, 1000);
    pullStats();

    function parseVisitTime(iso) {
      if (!iso) return null;
      const normalized = iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z";
      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function localDateKey(date) {
      const pad = (value) => String(value).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function localTimeText(date) {
      const pad = (value) => String(value).padStart(2, "0");
      return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function escapeActivityText(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }

    async function loadTodayActivity() {
      const list = document.getElementById("activity-list");
      const dateLabel = document.getElementById("activity-date");
      const now = new Date();
      const today = localDateKey(now);
      dateLabel.textContent = today;
      try {
        const response = await fetch("/api/visits?limit=200", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const visits = await response.json();
        const events = [];
        for (const visit of visits) {
          const appeared = parseVisitTime(visit.appeared_at);
          const left = parseVisitTime(visit.left_at);
          if (appeared && localDateKey(appeared) === today) events.push({ type: "进入", time: appeared, personId: visit.person_id });
          if (left && localDateKey(left) === today) events.push({ type: "离开", time: left, personId: visit.person_id });
        }
        events.sort((a, b) => b.time - a.time);
        if (!events.length) {
          list.innerHTML = '<div class="activity-empty">今天还没有人员活动记录</div>';
          return;
        }
        list.innerHTML = events.slice(0, 10).map((event) => `
          <div class="activity-row">
            <span class="activity-time">${localTimeText(event.time)}</span>
            <span class="activity-icon"><i class="bi ${event.type === "进入" ? "bi-person-plus" : "bi-person-dash"}"></i></span>
            <span class="activity-copy"><strong>人员${event.type}</strong><small>${localTimeText(event.time)} · ${escapeActivityText(event.personId)}</small></span>
          </div>
        `).join("");
      } catch (error) {
        list.innerHTML = '<div class="activity-empty">实际动态加载失败，稍后自动重试</div>';
      }
    }

    setInterval(loadTodayActivity, 3000);
    loadTodayActivity();
    updateInteractionCursor();

    const camRes = document.getElementById("cam-res");
    const camFps = document.getElementById("cam-fps");
    const camBitrate = document.getElementById("cam-bitrate");
    const camApply = document.getElementById("cam-apply");
    const camMsg = document.getElementById("cam-msg");
    let cameraListSignature = "";
    let activeStreamUrl = "/stream";
    let activeAudioUrl = "/api/audio/pcm";

    async function loadCameras() {
      const previous = cameraSelect.value;
      try {
        const res = await fetch("/api/cameras", { cache: "no-store" });
        if (!res.ok) throw new Error(`camera list request failed: ${res.status}`);
        const data = await res.json();
        const cameras = Array.isArray(data.cameras) ? data.cameras : [];
        const signature = JSON.stringify(cameras.map((camera) => [camera.id, camera.name, camera.online]));
        if (signature !== cameraListSignature) {
          cameraSelect.replaceChildren(...cameras.map((camera, index) => {
            const option = document.createElement("option");
            option.value = camera.id;
            option.textContent = camera.name || `摄像头 ${index + 1}`;
            option.disabled = camera.online === false;
            return option;
          }));
          cameraListSignature = signature;
        }
        if (!cameras.length) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "未检测到摄像头";
          cameraSelect.replaceChildren(option);
          cameraSelect.disabled = true;
          return;
        }
        const availableIds = new Set(cameras.map((camera) => camera.id));
        const selected = availableIds.has(data.selected_id)
          ? data.selected_id
          : (availableIds.has(previous) ? previous : cameras[0].id);
        cameraSelect.value = selected;
        cameraSelect.disabled = false;
        const selectedCamera = cameras.find((camera) => camera.id === selected);
        activeAudioUrl = selectedCamera?.audio_url || "/api/audio/pcm";
        if (selectedCamera?.stream_url && selectedCamera.stream_url !== activeStreamUrl) {
          activeStreamUrl = selectedCamera.stream_url;
          streamImage.src = `${activeStreamUrl}?camera=${Date.now()}`;
        }
      } catch (error) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "摄像头列表加载失败";
        cameraSelect.replaceChildren(option);
        cameraSelect.disabled = true;
      }
    }

    cameraSelect.addEventListener("change", async () => {
      const cameraId = cameraSelect.value;
      if (!cameraId) return;
      const resumeAudio = audioEnabled || audioConnecting;
      if (resumeAudio) await stopAudioStream(false);
      cameraSelect.disabled = true;
      streamContainer.classList.remove("stream-ready");
      streamLoading.hidden = false;
      streamLoadingTitle.textContent = "正在切换摄像头";
      streamLoadingDetail.textContent = "正在释放当前设备并连接新画面";
      try {
        const res = await fetch("/api/cameras", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ camera_id: cameraId })
        });
        if (!res.ok) throw new Error(`camera selection failed: ${res.status}`);
        const data = await res.json();
        activeStreamUrl = data.selected.stream_url || "/stream";
        activeAudioUrl = data.selected.audio_url || "/api/audio/pcm";
        streamImage.src = `${activeStreamUrl}?camera=${Date.now()}`;
      } catch (error) {
        streamLoadingTitle.textContent = "摄像头切换失败";
        streamLoadingDetail.textContent = "请确认设备仍已连接，然后重试";
      } finally {
        await loadCameras();
        await loadCamSettings();
        if (resumeAudio) await startAudioStream();
      }
    });

    function scheduleDaysText(days) {
      if (!Array.isArray(days) || !days.length) return "每天";
      const names = { 1: "周一", 2: "周二", 3: "周三", 4: "周四", 5: "周五", 6: "周六", 7: "周日" };
      return days.map((d) => names[d] || d).join("、");
    }

    function applyScheduleToForm(schedule) {
      if (!schedule) return;
      if (scheduleStart && schedule.start) scheduleStart.value = schedule.start.padStart(5, "0");
      if (scheduleEnd && schedule.end) scheduleEnd.value = schedule.end.padStart(5, "0");
      const days = Array.isArray(schedule.days) ? schedule.days : [];
      scheduleDayInputs.forEach((input) => {
        input.checked = days.includes(parseInt(input.value, 10));
      });
    }

    function updateRecordingInfo(d) {
      const mode = d.recording_mode || (d.local_recording_enabled ? "continuous" : "off");
      updateRecordButtons(mode, false);
      applyScheduleToForm(d.recording_schedule);
      if (recordModeMetric) {
        recordModeMetric.textContent = mode === "off" ? "已关闭"
          : mode === "schedule" ? (d.schedule_in_window ? "定时 · 录制中" : "定时 · 时段外")
          : mode === "auto" ? "自动" : "已开启";
      }
      if (!recordStatus) return;
      if (mode === "off") {
        recordStatus.textContent = "录像已关闭";
        recordStatus.style.color = "var(--text-muted)";
        return;
      }
      if (mode === "auto" && !d.recording_active) {
        recordStatus.textContent = "自动 · 等待人员";
        recordStatus.style.color = "var(--text-muted)";
        return;
      }
      if (mode === "auto" && d.auto_stop_remaining_ms > 0) {
        recordStatus.textContent = `无人，${Math.ceil(d.auto_stop_remaining_ms / 1000)} 秒后停止`;
        recordStatus.style.color = "#a66500";
        return;
      }
      if (mode === "schedule") {
        const s = d.recording_schedule || {};
        const windowText = `${scheduleDaysText(s.days)} ${s.start || "--"}–${s.end || "--"}`;
        if (!d.schedule_in_window) {
          recordStatus.textContent = `定时录制 · 当前在时段外（${windowText}）`;
          recordStatus.style.color = "var(--text-muted)";
          return;
        }
        const currentFile = d.local_recording_current_file || "等待首个录像分片生成";
        recordStatus.textContent = `定时录制 · 时段内正在录像（${windowText}） | 当前文件: ${currentFile}`;
        recordStatus.style.color = d.local_recording_status === "recording" ? "var(--accent)" : "var(--text-muted)";
        return;
      }
      const currentFile = d.local_recording_current_file || "等待首个录像分片生成";
      recordStatus.textContent = `${mode === "auto" ? "自动 · 正在录像" : "持续录像中"} | 当前文件: ${currentFile}`;
      recordStatus.style.color = d.local_recording_status === "recording" ? "var(--accent)" : "var(--text-muted)";
    }

    async function loadCamSettings() {
      try {
        const res = await fetch("/api/selected_capture_info");
        if (!res.ok) throw new Error(`camera status request failed: ${res.status}`);
        const d = await res.json();
        const key = `${d.requested_width}x${d.requested_height}`;
        for (const opt of camRes.options) {
          if (opt.value === key) { opt.selected = true; break; }
        }
        for (const opt of camFps.options) {
          if (parseInt(opt.value) === (d.target_fps || 30)) { opt.selected = true; break; }
        }
        for (const opt of camBitrate.options) {
          if (parseInt(opt.value) === (d.requested_bitrate || 4000000)) { opt.selected = true; break; }
        }
        updateRecordingInfo(d);
      } catch (e) {}
    }

    camApply.addEventListener("click", async () => {
      const [w, h] = camRes.value.split("x").map(Number);
      const fps = parseInt(camFps.value);
      const bitrate = parseInt(camBitrate.value);
      const originalLabel = camApply.textContent;
      camApply.disabled = true;
      camApply.textContent = "切换中...";
      camMsg.textContent = "";
      streamContainer.classList.remove("stream-ready");
      streamLoading.hidden = false;
      streamLoadingTitle.textContent = "正在应用摄像头设置";
      streamLoadingDetail.textContent = `${w}×${h} · ${fps} FPS`;
      try {
        const res = await fetch("/api/camera_settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ width: w, height: h, fps, bitrate })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.detail || `camera settings request failed: ${res.status}`);
        streamImage.src = `${activeStreamUrl}?settings=${Date.now()}`;
        camMsg.textContent = `已应用：${w}×${h} · ${fps} FPS · ${(bitrate / 1000000).toFixed(0)}Mbps`;
        camMsg.style.color = "var(--accent)";
        await loadCamSettings();
      } catch (e) {
        camMsg.textContent = `切换失败：${e.message || "请重试"}`;
        camMsg.style.color = "#ef4444";
        streamLoadingTitle.textContent = "摄像头设置失败";
        streamLoadingDetail.textContent = "请确认摄像头在线后重试";
      } finally {
        camApply.disabled = false;
        camApply.textContent = originalLabel;
      }
    });

    async function changeRecordingMode() {
      const mode = recordToggle ? recordToggle.value : "off";
      updateRecordButtons(mode, true);
      try {
        const res = await fetch("/api/recording_mode", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode })
        });
        const d = await res.json();
        updateRecordingInfo(d);
      } catch (e) {
        await loadCamSettings();
        if (recordStatus) {
          recordStatus.textContent = "录像模式切换失败";
          recordStatus.style.color = "#ef4444";
        }
      }
    }

    if (recordToggle) recordToggle.addEventListener("change", changeRecordingMode);

    async function saveRecordingSchedule() {
      if (!scheduleApply) return;
      const days = scheduleDayInputs.filter((input) => input.checked).map((input) => parseInt(input.value, 10));
      scheduleApply.disabled = true;
      scheduleMsg.textContent = "";
      try {
        const res = await fetch("/api/recording_schedule", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start: scheduleStart.value, end: scheduleEnd.value, days })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.detail || `HTTP ${res.status}`);
        scheduleMsg.textContent = `已保存：${scheduleDaysText(d.schedule.days)} ${d.schedule.start}–${d.schedule.end}${d.schedule_in_window ? "（当前在时段内）" : "（当前在时段外）"}`;
        scheduleMsg.style.color = "var(--accent)";
        await loadCamSettings();
      } catch (e) {
        scheduleMsg.textContent = `保存失败：${e.message || "请重试"}`;
        scheduleMsg.style.color = "#ef4444";
      } finally {
        scheduleApply.disabled = false;
      }
    }

    if (scheduleApply) scheduleApply.addEventListener("click", saveRecordingSchedule);

    loadCamSettings();
    loadCameras();
    setInterval(loadCameras, 10000);
    setInterval(loadCamSettings, 5000);
    updateSoundButtons();
    updateRecordButtons("off");
  </script>
</body>

</html>
